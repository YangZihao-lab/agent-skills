name: Sync upstream skills

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - upstream-skills.json
      - scripts/sync_upstream.py
      - .github/workflows/sync-upstream-skills.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate sync script
        run: python -m py_compile scripts/sync_upstream.py

      - name: Mirror pinned skills
        run: python scripts/sync_upstream.py

      - name: Commit mirrored files
        shell: bash
        run: |
          if git diff --quiet -- skills; then
            echo "No upstream skill changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          git commit -m "Sync pinned upstream skills"
          git push
