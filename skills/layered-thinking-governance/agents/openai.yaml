interface:
  display_name: "Layered Thinking Governance"
  short_description: "按层级上浮复核、限制长期产物，并在结构膨胀时触发剃刀审计"
  default_prompt: "Use $layered-thinking-governance to classify the current problem by layer, perform an upward review without expanding authority, define the shortest main chain, allowed persistent artifacts and proof ceiling, close the two-pass convergence cycle unless a blocker or high-risk exception remains, and request $project-razor when structure grows beyond the approved mainline."

policy:
  allow_implicit_invocation: true
