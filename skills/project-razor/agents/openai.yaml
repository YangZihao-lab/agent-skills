interface:
  display_name: "Project Razor"
  short_description: "沿最短主链做断舍离，删除一次性负担并阻止旧结构重建"
  default_prompt: "Use $project-razor to identify the shortest active mainline, current consumers, proof ceilings, disposable artifacts and duplicate truth sources; propose a reversible cut plan, mark failed legacy structures as DO_NOT_RECREATE, and never modify or restore anything without explicit approval."

policy:
  allow_implicit_invocation: false
